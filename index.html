<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>My Projects</title>
  <link rel="icon" type="image/png" href="/public/favicon.png">
  <link rel="apple-touch-icon" href="/public/favicon.png">
  <link rel="stylesheet" href="style.css?v=6">
</head>
<body>
  <div class="bg-blur" id="bgBlur"></div>
  <div class="bg-overlay"></div>
  <canvas class="particles-canvas" id="particlesCanvas"></canvas>
  <div class="clouds" id="clouds">
    <div class="cloud cloud-1"></div>
    <div class="cloud cloud-2"></div>
    <div class="cloud cloud-3"></div>
    <div class="cloud cloud-4"></div>
    <div class="cloud cloud-5"></div>
  </div>
  <div class="bg-glow" id="bgGlow"></div>
  <div class="secret-overlay" id="secretOverlay"></div>

  <div class="progress-bar" id="progressBar"></div>
  <div class="counter" id="counter">01 / 01</div>
  <div class="keys-hint" id="keysHint">
    <span><kbd>↑</kbd><kbd>↓</kbd> навигация</span>
    <span><kbd>Home</kbd><kbd>End</kbd> края</span>
  </div>

  <div class="cursor-dot" id="cursorDot"></div>
  <div class="cursor-ring" id="cursorRing"></div>

  <main class="portfolio" id="portfolio"></main>

  <div class="pagination" id="pagination"></div>

  <div class="ghost" id="ghost" aria-label="Привидение Бу, маскот портфолио">
    <div class="ghost-shadow" id="ghostShadow"></div>
    <div class="ghost-body" id="ghostBody">
      <div class="ghost-tail"></div>
      <div class="ghost-eye ghost-eye-left">
        <div class="ghost-pupil" id="pupilL"></div>
      </div>
      <div class="ghost-eye ghost-eye-right">
        <div class="ghost-pupil" id="pupilR"></div>
      </div>
      <div class="ghost-blush ghost-blush-left"></div>
      <div class="ghost-blush ghost-blush-right"></div>
      <div class="ghost-mouth"></div>
    </div>
    <div class="ghost-question">?</div>
    <div class="ghost-zzz" id="zzz">
      <span>z</span><span>z</span><span>z</span>
    </div>
    <div class="ghost-bubble" id="ghostBubble"></div>
  </div>

  <script src="script.js?v=6"></script>
</body>
</html>
